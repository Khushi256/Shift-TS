<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shiftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#4c9eff"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#shiftBg)" stroke="#222f46" stroke-width="2"/>

  <!-- Subtle grid lines indicating time-series space -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#182338" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="32" y1="12" x2="32" y2="52" stroke="#182338" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- SHIFT-TS Telemetry Pulse / Waveform Path -->
  <path
    d="M 10 32 L 20 32 L 25 18 L 31 46 L 38 23 L 44 32 L 54 32"
    fill="none"
    stroke="url(#pulseGrad)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Active prediction target dot -->
  <circle cx="54" cy="32" r="3" fill="#60a5fa" filter="url(#glow)"/>
</svg>